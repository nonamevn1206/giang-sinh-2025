<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Minecraft Clone</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="crosshair">+</div>
    
    <div id="damage-overlay" style="position:fixed; top:0; left:0; width:100vw; height:100vh; background:rgba(255,0,0,0.5); z-index:90; opacity:0; transition: opacity 0.2s; pointer-events:none;"></div>
    
    <div id="death-screen">
        <h1>Bạn đã chết!</h1>
        <button id="btn-respawn" onclick="window.respawn()">Hồi Sinh</button>
    </div>
    
    <!-- Thanh Sinh Tồn (Máu & Đói) -->
    <div id="survival-ui" style="position: absolute; bottom: 85px; left: 50%; transform: translateX(-50%); width: 430px; display: flex; justify-content: space-between; z-index: 100;">
        <div id="health-bar" style="display:flex; gap: 2px;">
            <!-- 10 Trái tim -->
        </div>
        <div id="hunger-bar" style="display:flex; gap: 2px; flex-direction: row-reverse;">
            <!-- 10 Đùi gà -->
        </div>
    </div>

    <!-- Thanh Vật Phẩm 1-9 -->
    <div id="hotbar" style="transform: translateX(-50%); width: auto; max-width: none;">
        <div class="slot active" data-type="1">Cỏ</div>
        <div class="slot" data-type="2">Đất</div>
        <div class="slot" data-type="3">Đá</div>
        <div class="slot" data-type="4">Gỗ</div>
        <div class="slot" data-type="6">Lá</div>
        <div class="slot" data-type="7">Cát</div>
        <div class="slot" data-type="9">Đuốc</div>
        <div class="slot" data-type="0"></div>
        <div class="slot" data-type="0"></div>
    </div>

    <div style="position: absolute; bottom: 25px; right: 25px; z-index: 50; background: rgba(0,0,0,0.6); border: 2px solid #ccc; padding: 10px 15px; color: white; font-family: monospace; font-size: 16px; font-weight: bold; pointer-events: none;">
        [ E ] MỞ TÚI ĐỒ & CHẾ TẠO
    </div>

    <!-- Inventory / Crafting Screen -->
    <div id="inventory-screen" style="display:none;">
        <h2 style="color:white;text-align:center;">Chế Tạo (Đóng: Phím E)</h2>
        <div style="display:flex; justify-content:center; gap:20px; margin-bottom:30px;">
            <div id="crafting-grid">
                <div class="inv-slot border-slot" data-slot="c0"></div>
                <div class="inv-slot border-slot" data-slot="c1"></div>
                <div class="inv-slot border-slot" data-slot="c2"></div>
                <div class="inv-slot border-slot" data-slot="c3"></div>
            </div>
            <div style="color:white; font-size:40px; align-self:center;">➜</div>
            <div id="crafting-result">
                <div class="inv-slot border-slot result-slot" data-slot="r0"></div>
            </div>
        </div>
        
        <h2 style="color:white;text-align:center;">Túi đồ</h2>
        <div id="inventory-grid">
            <!-- Render 18 ô túi đồ -->
        </div>
    </div>

    <!-- Nạp Thư viện đồ hoạ Three.js và PointerLock -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/PointerLockControls.js"></script>
    <!-- Trình thuật toán Sinh địa hình ngẫu nhiên -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/simplex-noise/2.4.0/simplex-noise.min.js"></script>

    <!-- Các Module của Game -->
    <script src="audio_engine.js"></script>
    <script src="terrain.js"></script>
    <script src="physics.js"></script>
    <script src="mobs.js"></script>
    <script src="controls.js"></script>
    <script src="inventory.js"></script>
    <script src="main.js"></script>
</body>
</html>
